name: Build Check

# Runs full builds on PRs to verify builds work before merging
# Triggered on PR approval or when review is requested/submitted

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Only run builds when PR is approved or on PR open/sync from first-party
  check-approval:
    name: Check Approval Status
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check if should build
        id: check
        run: |
          if [ "${{ github.event_name }}" == "pull_request_review" ] && [ "${{ github.event.review.state }}" == "approved" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✓ PR approved - running builds"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ github.event.pull_request.author_association }}" == "OWNER" ] || \
               [ "${{ github.event.pull_request.author_association }}" == "MEMBER" ] || \
               [ "${{ github.event.pull_request.author_association }}" == "COLLABORATOR" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "✓ PR opened/synced from trusted actor - running builds"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "⏭ Skipping builds for non-collaborator PR"
            fi
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭ Skipping builds"
          fi

  # ============================================
  # Build Windows NSIS (x64 + ARM64)
  # ============================================
  build-windows:
    name: Build Windows (${{ matrix.label }})
    needs: check-approval
    if: needs.check-approval.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            target: x86_64-pc-windows-msvc
          - label: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable Windows Defender
        run: Set-MpPreference -ExclusionPath ${{ github.workspace }}
        shell: powershell

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS
        run: bash scripts/build-windows.sh "${{ matrix.target }}"
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: sccache stats
        run: sccache --show-stats || true
        shell: bash

      - name: Stop sccache
        if: always()
        run: sccache --stop-server || true
        shell: bash

  # ============================================
  # Build Linux
  # ============================================
  build-linux:
    name: Build Linux
    needs: check-approval
    if: needs.check-approval.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux
        run: bash scripts/build-linux.sh appimage
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Stop sccache
        if: always()
        run: sccache --stop-server || true

  # ============================================
  # Build Android (ARM64 quick check)
  # ============================================
  build-android:
    name: Build Android
    needs: check-approval
    if: needs.check-approval.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-36"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android (debug, ARM64)
        run: NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" pnpm tauri android build --apk --target aarch64 --debug

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Stop sccache
        if: always()
        run: sccache --stop-server || true
